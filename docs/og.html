<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{--bg:#0d0d10;--fg:#e8e6ef;--mut:#8b8899;--acc:#ff60ff;--line:#26242e;--code:#b9f6c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px}
body{background:var(--bg);font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  display:flex;align-items:center;justify-content:center}
.win{width:1120px;height:496px;background:#141419;border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden}
.bar{height:46px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:9px}
.dot{width:12px;height:12px;border-radius:50%;background:#2f2d38}
.bar .t{margin-left:14px;color:var(--mut);font-size:14px;letter-spacing:.02em}
.body{flex:1;padding:46px 56px 0;display:flex;flex-direction:column}
h1{font-size:112px;line-height:1;letter-spacing:-.045em;color:var(--fg);font-weight:600}
h1 span{color:var(--acc)}
.tag{margin-top:18px;font-size:27px;color:var(--mut);letter-spacing:-.01em}
.pts{margin-top:30px;font-size:21px;color:#6f6c7d;line-height:1.75}
.pts b{color:var(--fg);font-weight:400}
.foot{margin-top:auto;margin-bottom:34px;display:flex;align-items:baseline;justify-content:space-between}
.prompt{font-size:25px;color:var(--mut);display:flex;align-items:center}
.prompt b{color:var(--code);font-weight:400;margin-left:12px}
.cur{display:inline-block;width:13px;height:27px;background:var(--acc);margin-left:11px;transform:translateY(4px)}
.url{font-size:22px;color:var(--acc)}
</style></head><body>
<div class="win">
  <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="t">~/src/klash</span></div>
  <div class="body">
    <h1>k<span>lash</span></h1>
    <div class="tag">A terminal coding agent for models you run yourself.</div>
    <div class="pts">
      Talks to <b>llama.cpp</b> on your own machine.<br>
      Never phones home by default.
    </div>
    <div class="foot">
      <div class="prompt">$<b>klash</b><i class="cur"></i></div>
      <div class="url">github.com/jaekwon/klash</div>
    </div>
  </div>
</div>
</body></html>
